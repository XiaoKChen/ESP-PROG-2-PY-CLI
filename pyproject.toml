[project]
name = "esp-prog2-flasher"
version = "0.1.0"
description = "TUI/CLI flasher for the RA4M1 (UNO R4 Minima) bootloader via an ESP-Prog-2 (CMSIS-DAP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "esptool>=5.3.0",
    "pyocd>=0.44.1",
    "pyserial>=3.5",
    "textual>=8.2.7",
    "truststore>=0.10.4",
]

[project.scripts]
esp-prog2-flasher = "esp_prog2_flasher.cli:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
