name: Build standalone binaries

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: esp-prog2-flasher-windows
            binary: dist/esp-prog2-flasher.exe
          - os: macos-latest
            artifact: esp-prog2-flasher-macos
            binary: dist/esp-prog2-flasher
          - os: ubuntu-latest
            artifact: esp-prog2-flasher-linux
            binary: dist/esp-prog2-flasher
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync

      - name: Build executable
        run: uv run pyinstaller esp-prog2-flasher.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/esp-prog2-flasher-windows/esp-prog2-flasher.exe
            artifacts/esp-prog2-flasher-macos/esp-prog2-flasher
            artifacts/esp-prog2-flasher-linux/esp-prog2-flasher
